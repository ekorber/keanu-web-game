<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Browser Edition - Game</title>
  <link rel="stylesheet" href="/src/styles/game.css">
</head>
<body>
  <div id="game-container">
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <h1>Minecraft Browser Edition</h1>
        <div class="loading-spinner"></div>
        <p class="loading-text">Generating world...</p>
      </div>
    </div>

    <div id="hud" class="hud hidden">
      <div class="hud-top">
        <div class="health-bar">
          <span class="label">Health:</span>
          <div class="hearts">
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
          </div>
        </div>
        <div class="hunger-bar">
          <span class="label">Hunger:</span>
          <div class="food">
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
            <span class="drumstick">🍖</span>
          </div>
        </div>
      </div>

      <div class="crosshair">+</div>

      <div class="hud-bottom">
        <div class="hotbar">
          <div class="hotbar-slot active">1</div>
          <div class="hotbar-slot">2</div>
          <div class="hotbar-slot">3</div>
          <div class="hotbar-slot">4</div>
          <div class="hotbar-slot">5</div>
          <div class="hotbar-slot">6</div>
          <div class="hotbar-slot">7</div>
          <div class="hotbar-slot">8</div>
          <div class="hotbar-slot">9</div>
        </div>
      </div>
    </div>

    <div id="menu" class="menu hidden">
      <div class="menu-content">
        <h2>Game Menu</h2>
        <button class="menu-button" id="resumeButton">Resume Game</button>
        <button class="menu-button" id="settingsButton">Settings</button>
        <button class="menu-button" id="exitButton">Exit to Menu</button>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="/src/game.js"></script>
</body>
</html>
